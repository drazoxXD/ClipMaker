[package]
name = "clipmaker"
version = "0.1.0"
description = "Screen replay recorder"
edition = "2021"

[lib]
name = "clipmaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
chrono = "0.4"
dirs = "6"
base64 = "0.22"
log = "0.4"
ureq = "2"
nnnoiseless = { version = "0.5", default-features = false }
ffmpeg-sys-next = { version = "9", default-features = false, features = ["avcodec", "avformat", "swscale"] }

[dependencies.windows]
version = "0.62"
features = [
	"Foundation",
	"Graphics",
	"Graphics_Capture",
	"Graphics_DirectX",
	"Graphics_DirectX_Direct3D11",
	"Win32_Foundation",
	"Win32_Graphics_Direct3D",
	"Win32_Graphics_Direct3D11",
	"Win32_Graphics_Dxgi",
	"Win32_Graphics_Dxgi_Common",
	"Win32_Graphics_Gdi",
	"Win32_Media",
	"Win32_Media_Audio",
	"Win32_Media_Audio_Endpoints",
	"Win32_Devices_FunctionDiscovery",
	"Win32_Security",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_LibraryLoader",
	"Win32_System_Performance",
	"Win32_System_Threading",
	"Win32_System_Variant",
	"Win32_System_WinRT",
	"Win32_System_WinRT_Direct3D11",
	"Win32_System_WinRT_Graphics_Capture",
	"Win32_UI_Input",
	"Win32_UI_Shell_PropertiesSystem",
	"Win32_UI_WindowsAndMessaging",
]

[dependencies.windows-core]
version = "0.62"

# bindgen (ffmpeg-sys-next's build script) overflows the 1 MB Windows main-thread stack unoptimized.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
